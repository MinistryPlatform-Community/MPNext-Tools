name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A new push to the same branch supersedes the run in flight. Pushes to the
# protected trunks are never cancelled — their runs gate merges and releases.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

# Least privilege: this workflow only reads the repo. The Codecov upload
# authenticates with its own token, not the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  # Deliberately ONE job, not several.
  #
  # Branch protection on `dev` and `main` requires the status check named
  # `test`. Adding lint/typecheck as separate jobs would leave them
  # unrequired — green-but-ignored — until someone also updated the
  # protection rules. As steps here they are covered by the existing rule.
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci`, not `npm install`: it installs exactly what the lockfile
      # pins and fails if package.json and package-lock.json disagree, rather
      # than silently resolving new versions and rewriting the lockfile in CI.
      - run: npm ci

      - name: Lint
        run: npm run lint

      # The gate this repo was missing.
      #
      # `tsconfig.json` includes `**/*.ts` and `**/*.tsx`, and `next.config.ts`
      # sets no `ignoreBuildErrors` — so a type error in a TEST file breaks
      # `npm run build`, and therefore a production deploy, while the suite
      # itself stays green. That is not hypothetical: two committed test files
      # sat on `dev` in exactly that state, caught only by a manual local run.
      - name: Type check
        run: npm run typecheck

      # Enforces the coverage thresholds in vitest.config.mts.
      - name: Test with coverage
        run: npm run test:coverage

      # Catches what tests and tsc cannot: a `server-only` module pulled into
      # a client component, Turbopack graph errors, and boot-time env guards.
      # The values are placeholders that satisfy `src/lib/env.ts` and the
      # secret guard in `src/lib/auth.ts`; the build makes no MP call (OIDC
      # discovery is lazy), so nothing here needs to be real or secret.
      - name: Build
        run: npm run build
        env:
          BETTER_AUTH_SECRET: ci-build-only-placeholder-secret-0123456789abcdef
          BETTER_AUTH_URL: http://localhost:3000
          MINISTRY_PLATFORM_BASE_URL: https://mp.example.invalid/ministryplatformapi
          MINISTRY_PLATFORM_CLIENT_ID: ci-build
          MINISTRY_PLATFORM_CLIENT_SECRET: ci-build-placeholder
          MP_SECURITY_ROLES: "*"
          NEXT_PUBLIC_MINISTRY_PLATFORM_FILE_URL: https://mp.example.invalid/ministryplatformapi/files

      # A statically prerendered route has no CSP nonce, so it would never
      # hydrate under the enforced policy. See scripts/check-prerender.mjs.
      - name: Check prerendered routes
        run: npm run check:prerender

      - uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage-final.json
          fail_ci_if_error: false
